# Generates web/src/api/gen/*.ts from the Go API types.
# Run from the repo root: go run github.com/gzuidhof/tygo@v0.2.21 generate
# (scripts/build.mjs does this).
packages:
  - path: "photobag/internal/library"
    output_path: "web/src/api/gen/library.ts"
    frontmatter: |
      import type { FileStats } from "./bag";
  - path: "photobag/internal/bag"
    output_path: "web/src/api/gen/bag.ts"
    include_files: ["bag.go"]
  - path: "photobag/internal/query"
    output_path: "web/src/api/gen/query.ts"
  - path: "photobag/internal/scoring"
    output_path: "web/src/api/gen/scoring.ts"
    include_files: ["service.go"]
    frontmatter: |
      import type { ImageQuery } from "./query";
  - path: "photobag/internal/dedup"
    output_path: "web/src/api/gen/dedup.ts"
    frontmatter: |
      import type { ImageQuery } from "./query";
  - path: "photobag/internal/importer"
    output_path: "web/src/api/gen/importer.ts"
  - path: "photobag/internal/exporter"
    output_path: "web/src/api/gen/exporter.ts"
    frontmatter: |
      import type { ImageQuery } from "./query";
  - path: "photobag/internal/jobs"
    output_path: "web/src/api/gen/jobs.ts"
  - path: "photobag/internal/backup"
    output_path: "web/src/api/gen/backup.ts"
  - path: "photobag/internal/analysis"
    output_path: "web/src/api/gen/analysis.ts"
    include_files: ["settings.go", "runner.go", "check.go", "tagger.go"]
    frontmatter: |
      import type { ImageQuery } from "./query";
  - path: "photobag/internal/comfy"
    output_path: "web/src/api/gen/comfy.ts"
    include_files: ["workflow.go", "sweep.go", "info.go"]
  - path: "photobag/internal/experiments"
    output_path: "web/src/api/gen/experiments.ts"
    include_files: ["types.go"]
    frontmatter: |
      import type { Node, Override, Applied, Dim } from "./comfy";
  - path: "photobag/internal/decks"
    output_path: "web/src/api/gen/decks.ts"
    include_files: ["types.go"]
  - path: "photobag/internal/files"
    output_path: "web/src/api/gen/files.ts"
    include_files: ["files.go", "tree.go", "transfer.go"]
    frontmatter: |
      export type FileKind = "folder" | "text" | "markdown" | "image" | "pdf" | "audio" | "video" | "other";
  - path: "photobag/internal/reencode"
    output_path: "web/src/api/gen/reencode.ts"
    include_files: ["types.go"]
  - path: "photobag/internal/tagger"
    output_path: "web/src/api/gen/tagger.ts"
    include_files: ["status.go"]
type_mappings:
  time.Time: "string /* RFC3339 */"
  imaging.Format: "string"
  query.ImageQuery: "ImageQuery"
  bag.FileStats: "FileStats"
  comfy.Node: "Node"
  comfy.Override: "Override"
  comfy.Applied: "Applied"
  comfy.Dim: "Dim"
